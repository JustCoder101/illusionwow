name: Build Pygame APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Автоматическая сборка через Buildozer с кэшированием SDK/NDK
    - name: Build APK with Buildozer
      id: buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    # Загрузка готового APK в артефакты сборки GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pygame-game-apk
        path: ${{ steps.buildozer.outputs.filename }}
