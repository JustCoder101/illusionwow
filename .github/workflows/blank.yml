name: Build Pygame APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем репозиторий
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем кэширование глобальной директории Buildozer
    # Автор экшена рекомендует кэшировать именно `.buildozer_global` (где хранятся Android SDK/NDK)
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-global-

    # 3. Запускаем сборку с помощью правильного экшена
    - name: Build APK with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
        repository_root: .
        workdir: .

    # 4. Сохраняем готовый APK-файл в артефакты GitHub
    # Используем динамический путь из выходных данных (outputs) экшена
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pygame-debug-apk
        path: ${{ steps.buildozer.outputs.filename }}
        
